<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tile Kings - Visual Card & Piece Designer Application">
  <title>Tile Kings - Visual Card & Piece Designer</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="designer-body">

  <!-- Top App Switcher Banner -->
  <div class="top-app-switcher">
    <div class="switcher-left">
      <span class="app-tag">TILE KINGS DEV SUITE</span>
    </div>
    <div class="switcher-tabs">
      <a href="index.html" class="nav-tab">🎮 Play Game Sandbox</a>
      <a href="designer.html" class="nav-tab active">🎨 Visual Card Designer</a>
    </div>
  </div>

  <!-- Main Designer Mount Point -->
  <div id="designerContainer" style="height: calc(100vh - 40px);"></div>

  <!-- Load Designer App Engine (Checks src/designer.js with fallback to designer.js) -->
  <script src="src/designer.js?v=2" onerror="this.onerror=null;var s=document.createElement('script');s.src='designer.js?v=2';document.head.appendChild(s);"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function() {
      var container = document.getElementById("designerContainer");
      function initApp() {
        if (window.TileKingsDesigner && window.TileKingsDesigner.DesignerApp) {
          window.designerApp = new window.TileKingsDesigner.DesignerApp(container);
        } else {
          setTimeout(initApp, 100);
        }
      }
      initApp();
    });
  </script>
</body>
</html>
